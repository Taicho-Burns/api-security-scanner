# Brings up the platform (dashboard + API) with PostgreSQL.
# Run:  docker compose up --build
# Then open http://localhost:5000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
      POSTGRES_DB: scanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  platform:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      DATABASE_URL: postgresql+psycopg2://scanner:scanner@db:5432/scanner
      SECRET_KEY: change-me-in-production
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  pgdata:
